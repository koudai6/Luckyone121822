<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="聊天">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v2.png">
<link rel="icon" type="image/png" sizes="180x180" href="./apple-touch-icon-v2.png">
<title>聊天</title>
<style>
:root{--bg:#fff;--ink:#111;--mute:#8e8e93;--tb:#fff;--tbc:#111;--mb:#e6e6e8;--mbc:#111;--sh:0 1px 4px rgba(0,0,0,.08);--glass:rgba(255,255,255,.72);--pill:rgba(120,120,128,.14);--field:#fff;--line:rgba(0,0,0,.08);--ff:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
html.dk{--bg:#000;--ink:#f2f2f7;--tb:#2c2c2e;--tbc:#f2f2f7;--mb:#3a3a3c;--mbc:#fff;--sh:none;--glass:rgba(28,28,30,.72);--pill:rgba(120,120,128,.28);--field:#1c1c1e;--line:rgba(255,255,255,.1)}
@media(prefers-color-scheme:dark){html:not(.lt){--bg:#000;--ink:#f2f2f7;--tb:#2c2c2e;--tbc:#f2f2f7;--mb:#3a3a3c;--mbc:#fff;--sh:none;--glass:rgba(28,28,30,.72);--pill:rgba(120,120,128,.28);--field:#1c1c1e;--line:rgba(255,255,255,.1)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* 顶栏：iOS 信息样式（返回圆钮 + 居中头像 + 名字药丸） */
header{position:absolute;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top) + 6px) 12px 10px;display:flex;flex-direction:column;align-items:center;
 background:linear-gradient(var(--bg) 40%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.back{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 12px);width:44px;height:44px;border-radius:50%;border:.5px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:grid;place-items:center;color:var(--ink);padding:0;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.av{width:62px;height:62px;border-radius:50%;background:linear-gradient(160deg,#c9c9ce,#8e8e93);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:600;overflow:hidden;margin-top:2px}
.av img{width:100%;height:100%;object-fit:cover}
.nm{margin-top:4px;padding:3px 10px 3px 12px;border-radius:14px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;gap:3px}
.nm svg{opacity:.4}

/* 聊天区 */
#chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 124px) 14px 14px;display:flex;flex-direction:column}
.dsep{align-self:center;margin:6px 0 12px;padding:4px 14px;border-radius:12px;background:var(--pill);font-size:12px;font-weight:600;color:var(--mute)}
.r{display:flex;flex-direction:column;margin-top:3px;max-width:100%}
.r.first{margin-top:12px}
.r.mine{align-items:flex-end}.r.theirs{align-items:flex-start}

/* 气泡：时间在气泡内右侧；每段第一条带小尾巴 */
.m{position:relative;display:inline-flex;align-items:flex-end;gap:10px;max-width:80%;padding:8px 12px 7px 14px;border-radius:var(--br,19px);font-size:16px;line-height:1.35;word-break:break-word;box-shadow:var(--sh)}
.m .t{flex:none;font-size:11px;line-height:1.7;color:currentColor;opacity:.45;font-variant-numeric:tabular-nums}
.theirs .m{background:var(--tb);color:var(--tbc)}
.mine .m{background:var(--mb);color:var(--mbc)}
.r.first.theirs .m{border-top-left-radius:6px}
.r.first.mine .m{border-top-right-radius:6px}
.r.first .m::before{content:"";position:absolute;top:0;width:9px;height:12px;background:inherit}
.r.first.theirs .m::before{left:-5px;clip-path:polygon(100% 0,100% 100%,0 0)}
.r.first.mine .m::before{right:-5px;clip-path:polygon(0 0,100% 0,0 100%)}
.m.col{flex-direction:column;align-items:stretch;gap:2px}
.m.col .t{align-self:flex-end}
#chat .r{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#qbar{flex:none;display:none;align-items:center;gap:10px;margin:0 12px;padding:8px 8px 8px 12px;border-radius:14px;background:rgba(120,120,128,.14);font-size:13px;line-height:1.3}
#qbar.on{display:flex}#qbar div{flex:1;min-width:0}#qbar b{display:block;font-weight:600;opacity:.7}#qbar span{display:block;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qbar button{border:0;background:none;color:var(--ink);font-size:20px;line-height:1;padding:4px 8px;opacity:.6}
#mm{position:fixed;inset:0;z-index:92;display:none}#mm.on{display:block}
#mmc{position:absolute;display:flex;padding:7px 4px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:0 8px 28px rgba(0,0,0,.28);animation:mmin .14s ease-out}
@keyframes mmin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
#mmc button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:54px;border:0;background:none;color:inherit;font:inherit;font-size:12px;padding:5px 6px}
#mmc button svg{width:20px;height:20px}
#mmc::after{content:"";position:absolute;left:var(--ax,50%);width:12px;height:12px;background:var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:2px}
#mmc.up::after{bottom:-5px}#mmc.dn::after{top:-5px}
.q{display:flex;gap:8px;align-items:stretch;margin:0 0 3px;padding:6px 8px;border-radius:10px;background:rgba(120,120,128,.16);font-size:13px;line-height:1.3}
.q::before{content:"";width:3px;border-radius:2px;background:currentColor;opacity:.35}
.q b{display:block;font-weight:600;opacity:.7}.q span{opacity:.7}

/* 转账卡片 */
.pay{width:min(280px,76%);border-radius:16px;overflow:hidden;background:var(--mb);color:var(--mbc);box-shadow:var(--sh)}
.pay .a{padding:14px 16px 10px;font-size:34px;font-weight:700;letter-spacing:-.5px}
.pay .a small{font-size:13px;font-weight:600;opacity:.5;letter-spacing:0;margin-left:4px}
.pay .a i{font-style:normal;font-size:20px;margin-right:2px}
.pay .s{padding:0 16px 12px;font-size:12px;opacity:.55}
.pay .f{padding:8px 16px;border-top:1px solid rgba(120,120,128,.25);font-size:11px;opacity:.55}

/* 输入中 */
.dots{display:inline-flex;gap:5px;padding:12px 14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}

/* 输入栏 */
.bar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bg)}
.plus{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;padding:0}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:6px;min-height:46px;border-radius:24px;background:var(--field);box-shadow:0 1px 6px rgba(0,0,0,.08);padding-right:10px}
html.dk .field,html:not(.lt) .field{box-shadow:none}
#ta{flex:1;min-width:0;height:24px;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:0 0 0 18px}
#ta::placeholder{color:#a8a8ad}
.ic{flex:none;width:30px;height:30px;border:0;background:none;color:var(--mute);display:grid;place-items:center;padding:0}
.send{color:var(--ink)}

/* 右上角三个点 */
.back.r2{left:auto;right:14px}
html.bgimg #app{background-size:cover;background-position:center}
html.bgimg header{background:none}
html.bgimg .bar{background:transparent}
/* 个人资料页（参考 P1） */
#pf{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 40px;visibility:hidden}
#pf.on{transform:none;visibility:visible}
.pt{display:flex;justify-content:space-between;height:36px}
.pt button{border:0;background:none;color:var(--ink);padding:6px;display:grid;place-items:center}
.pav{width:140px;height:140px;border-radius:50%;margin:10px auto 0;background:linear-gradient(160deg,#c9c9ce,#8e8e93);color:#fff;display:grid;place-items:center;font-size:56px;font-weight:600;overflow:hidden}
.pav img{width:100%;height:100%;object-fit:cover}
.pn{text-align:center;font-size:30px;font-weight:800;margin-top:22px}
.pi{text-align:center;font-size:17px;font-weight:600;color:var(--mute);margin-top:6px}
.acts{display:flex;justify-content:space-between;margin:32px 6px 0}
.acts label,.acts button{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:0;width:25%}
.acts i{width:68px;height:68px;border-radius:50%;background:rgba(120,120,128,.12);display:grid;place-items:center}
.card{margin-top:34px;border-radius:26px;background:rgba(120,120,128,.12);padding:0 4px 0 18px}
.row{display:flex;align-items:center;gap:14px;min-height:62px;font-size:17px;font-weight:700;border:0;background:none;color:var(--ink);width:100%;font-family:inherit;padding:0 14px 0 0;text-align:left}
.row+.row,.row+label.row,label.row+.row,label.row+label.row{border-top:.5px solid rgba(120,120,128,.35);margin-left:42px;width:calc(100% - 42px);padding-left:0}
.row svg.l{flex:none;width:28px;height:28px;color:var(--mute);margin-left:0;margin-right:0}
.row+.row svg.l{display:none}
.row .v{margin-left:auto;color:var(--mute);font-weight:600;font-size:16px}
.row .c{color:var(--mute);flex:none}
.rg{margin-left:auto;display:flex;align-items:center;gap:8px;width:50%;color:var(--mute);font-size:13px}.rg input{flex:1;width:100%}
.hid{display:none}

.sys{align-self:center;font-size:12px;color:var(--mute);margin:12px 0 4px}
.stk{max-width:96px;max-height:96px;object-fit:contain;display:block}
.em{font-size:46px;line-height:1.2}
.m.nb{background:none;box-shadow:none;padding:0}
.m.nb::before,.m.ph::before{display:none!important}
.m.ph{padding:0;overflow:hidden;border-radius:16px!important}
.m.ph img{display:block;max-width:min(240px,64vw);max-height:300px}
.m.ph .t{position:absolute;right:8px;bottom:6px;color:#fff;opacity:1;background:rgba(0,0,0,.35);padding:0 6px;border-radius:8px;line-height:1.6}
.sheet{position:fixed;inset:0;z-index:40;display:none}.sheet.on{display:block}
.sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.25)}
.sheet .bd{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:62vh;overflow:auto;box-shadow:0 -4px 24px rgba(0,0,0,.12)}
.grid4,.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;justify-items:center}
.gi{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;padding:0}
.gi i{width:58px;height:58px;border-radius:18px;background:rgba(120,120,128,.12);display:grid;place-items:center}
.sg{gap:10px 8px;align-items:center}
.sg .st{width:100%;aspect-ratio:1;display:grid;place-items:center;border:0;background:rgba(120,120,128,.1);border-radius:14px;padding:6px;font-size:30px;color:var(--mute)}
.sg img{max-width:100%;max-height:100%;object-fit:contain}
.hint{text-align:center;color:var(--mute);font-size:13px;padding:16px;white-space:pre-line}
.pg{position:fixed;inset:0;z-index:60;background:var(--bg);transform:translateX(100%);transition:transform .3s;visibility:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.pg.on{transform:none;visibility:visible}
.ph2{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 10px;font-size:17px;flex:none}
.ph2 button{border:0;background:none;color:var(--ink);font:inherit;font-size:16px;padding:8px 10px;min-width:52px}.ph2 b{font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px;flex:none}
.chip{flex:none;border:0;border-radius:16px;padding:6px 13px;background:rgba(120,120,128,.12);color:var(--ink);font:inherit;font-size:14px}.chip.on{background:var(--ink);color:var(--bg)}.chip.off{opacity:.45}
.srch{margin:6px 14px;border:0;border-radius:12px;background:rgba(120,120,128,.12);padding:10px 14px;font:inherit;font-size:15px;color:var(--ink);outline:0;flex:none}
.lst{flex:1;overflow:auto;padding:4px 14px 20px}
.cd{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:.5px solid rgba(120,120,128,.3)}.cd.dis{opacity:.45}.cd.sel{background:rgba(120,120,128,.14)}
.cd .mn{flex:1;min-width:0}.cd .ct{font-size:16px;word-break:break-all;margin-top:3px}.cd .cm{font-size:12px;color:var(--mute);margin-top:3px}.cd img{max-height:64px;max-width:96px;object-fit:contain}
.mini{border:0;background:rgba(120,120,128,.14);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;flex:none}
.tb{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:.5px solid var(--line);flex:none;align-items:center}
.tb[hidden]{display:none}
.tb button{flex:1;border:0;border-radius:14px;padding:12px 0;background:rgba(120,120,128,.14);color:var(--ink);font:inherit;font-size:15px;font-weight:600}.tb .dg{color:#e5484d}.tb span{font-size:14px;color:var(--mute);padding:0 6px}
.fr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;font-size:16px}
.fr input[type=number]{width:84px;text-align:right;border:0;border-radius:10px;background:rgba(120,120,128,.14);padding:8px 10px;font:inherit;color:var(--ink)}
.sec{margin-top:18px;font-size:13px;font-weight:700;color:var(--mute)}
#modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:24px}#modal.on{display:flex}
.mc{width:100%;max-width:340px;background:var(--bg);border-radius:22px;padding:18px;max-height:80vh;display:flex;flex-direction:column;gap:12px}.mc h3{margin:0;font-size:17px}
.mb{overflow:auto;display:flex;flex-direction:column;gap:10px}
.mb textarea,.mb select{width:100%;border:0;border-radius:12px;background:rgba(120,120,128,.12);padding:10px 12px;font:inherit;font-size:15px;color:var(--ink)}.mb textarea{min-height:110px;resize:none}
.mbt{display:flex;gap:8px}.mbt button{flex:1;border:0;border-radius:12px;padding:11px 0;background:rgba(120,120,128,.14);color:var(--ink);font:inherit;font-weight:600}.mbt .pr{background:var(--ink);color:var(--bg)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,32,.9);color:#fff;padding:9px 16px;border-radius:18px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center}#toast.on{opacity:1}
#call{position:fixed;inset:0;z-index:80;background:#101012;color:#fff;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 50px) 24px calc(env(safe-area-inset-bottom) + 36px);overflow:hidden}#call.on{display:flex}
#call .cbg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) brightness(.5)}#call>*{position:relative}#call>.cbg{position:absolute}
.cav{width:150px;height:150px;font-size:60px;margin-top:18px;border:0;padding:0;color:#fff}
.cn{font-size:28px;font-weight:700;margin-top:20px}.cs{font-size:15px;opacity:.7;margin-top:6px;font-variant-numeric:tabular-nums}.chint{font-size:12px;opacity:.5;margin-top:10px}
.cmsg{flex:1;overflow:auto;width:100%;text-align:center;margin:14px 0;font-size:17px;line-height:1.5;display:flex;flex-direction:column;gap:8px}
.cbt{display:flex;gap:34px}.cbt button{width:68px;height:68px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}.cbt .end{background:#ff3b30}.cbt .on{background:#fff;color:#111}

/* 转账卡片（小）*/
.pay{width:min(196px,58%)}
.pay .a{padding:10px 14px 4px;font-size:25px}.pay .a small{font-size:12px;margin-left:6px}.pay .a i{font-size:15px}
.pay .s{padding:0 14px 8px;font-size:11px}.pay .f{padding:6px 14px;font-size:10px}
.pay.th{background:var(--tb);color:var(--tbc)}.pay.tap{outline:1.5px solid var(--mute)}
.rd{align-self:flex-start;font-size:11px;color:var(--mute);margin:3px 6px 0}
.stt{position:absolute;top:calc(env(safe-area-inset-top) + 0px);left:calc(50% + 16px);max-width:34vw;padding:4px 10px;border-radius:12px 12px 12px 3px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid var(--line);font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:2}
.stt[hidden],.cst[hidden]{display:none}
.cst{margin-top:14px;padding:5px 12px;border-radius:14px;background:rgba(255,255,255,.18);font-size:13px;max-width:70vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;order:-1}
#call .cav{order:0}
.cbt .acc{background:#34c759}
.mb input{width:100%;border:0;border-radius:12px;background:rgba(120,120,128,.12);padding:11px 12px;font:inherit;font-size:15px;color:var(--ink);outline:0}
.mh{display:flex;align-items:center;gap:12px;padding:6px 0 14px;border-bottom:.5px solid rgba(120,120,128,.3)}.md{width:56px;height:56px;font-size:22px;margin:0}.mhn{font-size:18px;font-weight:700}.mhs{font-size:12px;color:var(--mute);margin-top:3px}
.sm{width:40px;height:40px;font-size:16px;flex:none;margin:0}
.po{display:flex;gap:10px;padding:14px 0;border-bottom:.5px solid rgba(120,120,128,.3)}.pb{flex:1;min-width:0}.pn2{font-weight:700;font-size:15px}.px{margin-top:4px;font-size:16px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.pi2{display:grid;gap:4px;margin-top:8px}.pi2.n1{grid-template-columns:minmax(0,200px)}.pi2.n2{grid-template-columns:repeat(2,1fr);max-width:260px}.pi2.n3{grid-template-columns:repeat(3,1fr);max-width:300px}
.pi2 img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.pi2.n1 img{aspect-ratio:auto;max-height:260px;object-fit:contain;object-position:left}
.pm{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--mute)}.sp{display:flex;gap:6px}
.pc{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(120,120,128,.1);font-size:14px;line-height:1.5}.pl{color:var(--mute);margin-bottom:2px}
.cbg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) brightness(.5);z-index:0}

:root{--gbg:#f2f2f7;--gcard:#fff;--gsep:rgba(60,60,67,.18);--gblue:#007aff}
html.dk{--gbg:#000;--gcard:#1c1c1e;--gsep:rgba(84,84,88,.6)}
@media(prefers-color-scheme:dark){html:not(.lt){--gbg:#000;--gcard:#1c1c1e;--gsep:rgba(84,84,88,.6)}}
/* 回复设置：iOS 设置页（分组圆角列表、分组页眉/页脚、开关、步进器、滑块）*/
#setPage{background:var(--gbg)}
#setPage .ph2{height:48px;border-bottom:.5px solid var(--gsep);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);position:relative}
#setPage .ph2 b{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:600}

<script>const $=id=>document.getElementById(id),R=document.documentElement;

const pool=(types)=>D.cards.filter(c=>c.enabled!==false&&types.includes(c.type)&&grpOn(c.group));
function pickCards(n,withImg){

  ['pointerup','pointercancel','pointerleave'].forEach(ev=>chat.addEventListener(ev,clr));
  chat.addEventListener('scroll',()=>{clr();$('mm').classList.remove('on')},{passive:true});
  chat.addEventListener('contextmenu',e=>{e.preventDefault();const r=e.target.closest('.r[data-i]');if(r&&!fired){const m=D.msgs[+r.dataset.i];if(m){fired=true;clr();msgMenu(m,r)}}});
  document.addEventListener('click',e=>{if(fired){fired=false;e.stopPropagation();e.preventDefault()}},true);
})();

/* ===== PWA：通知 / 保活 / 全屏 ===== */
let swReg=null,nSeenT=Date.now();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
async function showN(title,body,tag,force){
  if(!force&&D&&D.cfg&&D.cfg.notifOn===false)return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    const o={body,icon:'icons/icon-192.png',badge:'icons/icon-192.png'};if(tag)o.tag=tag;
    if(reg&&reg.showNotification)await reg.showNotification(title,o);else new Notification(title,o);
  }catch(e){}
}
function notifyScan(){
  if(typeof D==='undefined'||!D||!D.msgs)return;
  const fresh=D.msgs.filter(m=>m.w==='t'&&m.t>nSeenT&&!['read','sys','decide'].includes(m.type));
  if(!fresh.length)return;
  nSeenT=Math.max(...fresh.map(m=>m.t));
  if(!document.hidden)return;
  const m=fresh[fresh.length-1],nm=(D.S&&D.S.name)||'新消息';
  const body={sticker:'[表情包]',image:'[图片]',pay:'[转账]',letter:'[来信]'}[m.type]||String(m.x||'发来一条消息').slice(0,60);
  const bd=fresh.length>1?'['+fresh.length+'条] '+body:body;showN(nm,nBody(bd));
}
(function(){const _i=incoming;incoming=function(){if(document.hidden)showN((D.S&&D.S.name)||'来电',nBody('邀请你语音通话'));return _i.apply(this,arguments)}})();
function nStatus(){
  if(!('Notification' in window))return '不支持（需从主屏幕图标打开，iOS 16.4 以上）';
  return ({granted:'已允许',denied:'已禁止',default:'还没授权'})[Notification.permission]+' / '+(swReg&&swReg.active?'后台服务正常':'后台服务未就绪');
}
function getReg(){return Promise.race([navigator.serviceWorker.ready,new Promise((_,j)=>setTimeout(()=>j(new Error('后台服务未就绪')),4000))])}
/* 锁屏兜底：把新消息写进锁屏的播放卡片 */
const kTitle=()=>(D&&D.S&&D.S.id)||'聊天';
const nBody=b=>b;
function setLock(t,a){if(!('mediaSession' in navigator)||typeof MediaMetadata==='undefined')return;try{navigator.mediaSession.metadata=new MediaMetadata({title:t,artist:a,artwork:(D&&D.cfg&&D.cfg.coverOff===false)?[{src:'icons/icon-512.png',sizes:'512x512',type:'image/png'}]:[]})}catch(e){}}
async function testNotif(){
  if(!('Notification' in window)){toast('这里不支持通知：iOS 需 16.4 以上，并且要从主屏幕图标打开');return}
  let p=Notification.permission;
  if(p!=='granted'){try{p=await Notification.requestPermission()}catch(e){p='denied'}}
  if(p!=='granted'){toast(p==='denied'?'通知被禁止：到 系统设置 > 通知 里找到这个网站并打开':'没有获得通知权限');return}
  toast('5 秒内请锁屏，会收到一条测试通知');
  setTimeout(()=>showN((D.S&&D.S.name)||'聊天',nBody('这是一条测试通知'),'test',true),5000);
}
async function fullTest(){
  if(!('Notification' in window)||Notification.permission!=='granted'){await testNotif();return}
  toast('10 秒后对方会发消息，请现在锁屏');
  setTimeout(()=>{if(typeof busy!=='undefined'&&busy)return;reply()},10000);
}
/* 保活：循环播放近乎无声的音频，让安卓浏览器不冻结页面 */
let kaEl=null;
function startKeep(){
  if(D&&D.cfg&&D.cfg.keepOn===false)return;
  if(kaEl){kaEl.play().catch(()=>{});setLock(kTitle(),'在线');return}
  /* 16-bit、幅度仅 ±1（约 -90dB），人耳听不到，但系统会把它当成正在播放的音频 */
  const n=16000,b=new Uint8Array(44+n),v=new DataView(b.buffer),W=(o,t)=>[...t].forEach((c,i)=>b[o+i]=c.charCodeAt(0));
  W(0,'RIFF');v.setUint32(4,36+n,true);W(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);W(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n/2;i++)v.setInt16(44+i*2,i%2?1:-1,true);
  kaEl=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));kaEl.loop=true;kaEl.volume=1;kaEl.setAttribute('playsinline','');
  kaEl.addEventListener('pause',()=>{if(D.cfg.keepOn!==false&&document.hidden)setTimeout(()=>{kaEl.play().catch(()=>{})},300)});
  kaEl.addEventListener('play',()=>setLock(kTitle(),'在线'));
  kaEl.addEventListener('ended',()=>{kaEl.play().catch(()=>{})});
  setInterval(()=>{if(kaEl&&kaEl.paused&&D.cfg.keepOn!==false&&document.hidden)kaEl.play().catch(()=>{})},4000);
  kaEl.play().catch(()=>{});
  if('mediaSession' in navigator){setLock(kTitle(),'在线');try{navigator.mediaSession.playbackState='playing';['play','pause'].forEach(a=>navigator.mediaSession.setActionHandler(a,()=>{if(kaEl)kaEl.play().catch(()=>{})}))}catch(e){}}
}
function stopKeep(){if(kaEl)kaEl.pause();if('mediaSession' in navigator)navigator.mediaSession.metadata=null}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){setLock(kTitle(),'在线');if(kaEl&&kaEl.paused&&D.cfg.keepOn!==false)kaEl.play().catch(()=>{})}});
window.cfgHook=k=>{
  if(k==='coverOff'){setLock(kTitle(),'在线');toast(D.cfg.coverOff===false?'锁屏卡片带封面图':'锁屏卡片不带封面图')}
  if(k==='keepOn'){if(D.cfg.keepOn===false){stopKeep();toast('后台保活已关闭')}else{startKeep();toast('后台保活已开启')}}
  if(k==='notifOn'){
    if(D.cfg.notifOn===false){toast('消息弹窗已关闭');return}
    if(!('Notification' in window)){toast('当前浏览器不支持通知');return}
    if(Notification.permission==='granted'){toast('消息弹窗已开启');showN((D.S&&D.S.name)||'聊天',nBody('这是一条测试通知'),'test',true)}
    else if(Notification.permission==='denied')toast('通知被系统禁止，请在浏览器的网站设置里允许');
    else Notification.requestPermission().then(p=>{toast(p==='granted'?'消息弹窗已开启':'没有获得通知权限');if(p==='granted')showN((D.S&&D.S.name)||'聊天',nBody('这是一条测试通知'),'test',true)})
  }
};
/* 首次点击：申请通知权限、启动保活、进入全屏 */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target&&e.target.closest&&e.target.closest('#vw'))return;e.preventDefault()},{passive:false}));
let firstTap=false;
let askedN=false;
function askNotif(){if(askedN)return;if(D.cfg.notifOn===false||!('Notification' in window)||Notification.permission!=='default')return;askedN=true;try{Notification.requestPermission().catch(()=>{})}catch(e){}}
document.addEventListener('click',askNotif,{passive:true});document.addEventListener('touchend',askNotif,{passive:true});
document.addEventListener('pointerdown',()=>{
  if(firstTap)return;firstTap=true;
  startKeep();
  const std=matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches;
  if(!std&&R.requestFullscreen)R.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
},{once:false,passive:true});
</script>
